[package]
name = "mochi-client"
version = "0.1.0"
description = "Open-source Minecraft launcher with PvP presets"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mochi_client_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
keyring = "4.2"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
