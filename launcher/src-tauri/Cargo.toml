[package]
name = "mochi-client"
version = "0.1.0"
description = "Open-source Minecraft launcher with PvP presets"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mochi_client_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
